<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B繧ｹ繧ｫ繧ｦ繝・窶・謗｡逕ｨAI繧ｨ繝ｼ繧ｸ繧ｧ繝ｳ繝・/title>

<style>
/* B繧ｹ繧ｫ繧ｦ繝・窶・繝｡繧､繝ｳ繧ｹ繧ｿ繧､繝ｫ繧ｷ繝ｼ繝・*/
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --surface2: #eef0f3;
  --border: #e2e5ea;
  --text: #1a1f2e;
  --muted: #5a6272;
  --accent: #2563eb;
  --accent-h: #1d4ed8;
  --accent-l: #eff6ff;
  --purple: #7c3aed;
  --purple-l: #f5f3ff;
  --green: #059669;
  --green-l: #ecfdf5;
  --amber: #d97706;
  --amber-l: #fffbeb;
  --red: #dc2626;
  --red-l: #fef2f2;
  --pink: #db2777;
  --pink-l: #fdf2f8;
  --r: 8px;
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
}
body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.65; color:var(--text); background:#f0f2f6; min-height:100vh; }

/* 笏笏 TOPBAR 笏笏 */
.topbar {
  background:#111827; color:#fff;
  height:56px; padding:0 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:300;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.topbar-left { display:flex; align-items:center; gap:12px; }
.logo { width:36px; height:36px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:900; color:#fff; flex-shrink:0; }
.brand { display:flex; flex-direction:column; gap:1px; }
.brand-name { font-size:16px; font-weight:800; letter-spacing:.3px; line-height:1; }
.brand-sub { font-size:10px; color:#6b7280; letter-spacing:.6px; text-transform:uppercase; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.mode-pill { display:flex; align-items:center; gap:7px; background:#1f2937; border:1px solid #374151; border-radius:6px; padding:5px 12px; }
.mode-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mode-dot.ai  { background:#4ade80; box-shadow:0 0 6px #4ade80; animation:pulse 2s ease-in-out infinite; }
.mode-dot.demo{ background:#f59e0b; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.5} }
.mode-label { font-size:11px; color:#9ca3af; }
.mode-label strong { color:#e5e7eb; font-weight:700; }
.model-sel { background:#1f2937; border:1px solid #374151; border-radius:5px; color:#e5e7eb; font-size:12px; padding:5px 8px; }
.model-sel:focus { outline:none; }

/* 笏笏 LAYOUT 笏笏 */
.wrap { max-width:1000px; margin:0 auto; padding:28px 20px 80px; }

/* 笏笏 STEPPER 笏笏 */
.stepper { display:flex; background:var(--bg); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:24px; box-shadow:var(--shadow); }
.st { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:13px 6px; font-size:12px; color:var(--muted); border-right:1px solid var(--border); transition:background .2s; cursor:default; }
.st:last-child { border-right:none; }
.st-num { width:22px; height:22px; border-radius:50%; background:var(--surface2); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.st.done { background:var(--accent-l); color:var(--accent-h); }
.st.done .st-num { background:var(--accent); color:#fff; }
.st.active { background:var(--accent); color:#fff; font-weight:700; }
.st.active .st-num { background:rgba(255,255,255,.2); color:#fff; }
.st-label { white-space:nowrap; }
@media(max-width:640px){ .st-label { display:none; } }

/* 笏笏 PANEL 笏笏 */
.panel { display:none; }
.panel.on { display:block; animation:up .18s ease; }
@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* 笏笏 CARD 笏笏 */
.card { background:var(--bg); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; }
.card-head { padding:18px 22px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.card-title { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; }
.card-body { padding:22px; }
.icon-chip { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; flex-shrink:0; }

/* 笏笏 FORM 笏笏 */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid2.g1 { grid-template-columns:1fr; }
.fg { display:flex; flex-direction:column; gap:5px; }
.fg.s2 { grid-column:span 2; }
.fg label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.req { color:var(--red); margin-left:2px; }
.hint { font-size:11px; color:var(--muted); margin-top:3px; }
input[type=text], textarea, select {
  width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:6px;
  font:inherit; color:var(--text); background:var(--bg); resize:vertical; transition:border-color .15s, box-shadow .15s;
}
input[type=text]:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
textarea { min-height:82px; }
textarea.tall { min-height:110px; }
::placeholder { color:#c4cad4; }

/* 笏笏 BUTTONS 笏笏 */
.btn-row { display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
.btn { padding:9px 20px; border-radius:6px; font:600 14px/1 inherit; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; transition:all .15s; }
.btn-ghost { background:transparent; color:var(--muted); border:1.5px solid var(--border); }
.btn-ghost:hover { background:var(--surface); color:var(--text); }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-h); }
.btn-ai { background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; padding:11px 26px; font-size:15px; box-shadow:0 2px 12px rgba(37,99,235,.3); }
.btn-ai:hover { box-shadow:0 4px 20px rgba(37,99,235,.4); transform:translateY(-1px); }
.btn-sm { padding:6px 13px; font-size:12px; }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

/* 笏笏 LOADING 笏笏 */
.overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.7); z-index:400; align-items:center; justify-content:center; }
.overlay.on { display:flex; }
.load-card { background:var(--bg); border-radius:12px; padding:36px 48px; text-align:center; min-width:300px; box-shadow:0 24px 64px rgba(0,0,0,.25); }
.spin { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .85s linear infinite; margin:0 auto 16px; }
@keyframes spin { to{transform:rotate(360deg)} }
.load-steps { margin-top:18px; display:flex; flex-direction:column; gap:5px; }
.ls { display:flex; align-items:center; gap:8px; font-size:12px; color:#9ca3af; padding:5px 10px; border-radius:5px; }
.ls.on { color:var(--accent); background:var(--accent-l); font-weight:700; }
.ls.ok { color:var(--green); }
.ls-dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }

/* 笏笏 ERROR 笏笏 */
.err-bar { display:none; background:var(--red-l); border:1px solid #fecaca; border-radius:6px; padding:11px 16px; font-size:13px; color:var(--red); margin-bottom:14px; }
.err-bar.on { display:block; }

/* 笏笏 ANALYSIS BLOCKS 笏笏 */
.analysis-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ab { background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:14px 16px; }
.ab.full { grid-column:span 2; }
.ab.highlight { border-color:var(--accent); background:var(--accent-l); }
.ab.warn { border-color:#fde68a; background:var(--amber-l); }
.ab-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.ab-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.ab-text { font-size:13px; line-height:1.8; white-space:pre-wrap; }
.type-badge { display:inline-block; background:var(--purple); color:#fff; border-radius:20px; padding:3px 12px; font-size:13px; font-weight:700; margin-top:4px; }

/* score */
.score-wrap { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:14px 18px; margin-bottom:12px; }
.score-label { font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; }
.score-bar { flex:1; height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; }
.score-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--purple)); border-radius:5px; transition:width 1s cubic-bezier(.4,0,.2,1); }
.score-n { font-size:22px; font-weight:900; color:var(--accent); min-width:52px; text-align:right; }
.score-lv { font-size:11px; color:var(--muted); white-space:nowrap; }

/* 笏笏 APPEAL SELECTOR (STEP 3) 笏笏 */
.appeal-intro { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:18px; background:var(--accent-l); border:1px solid #bfdbfe; border-radius:6px; padding:12px 16px; }
.appeal-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-bottom:20px; }
.appeal-item { position:relative; }
.appeal-item input[type=checkbox] { position:absolute; opacity:0; width:0; height:0; }
.appeal-label {
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 14px; border:1.5px solid var(--border); border-radius:7px;
  cursor:pointer; background:var(--bg); transition:all .15s;
  user-select:none;
}
.appeal-label:hover { border-color:var(--accent); background:var(--accent-l); }
.appeal-item input:checked + .appeal-label {
  border-color:var(--accent); background:var(--accent-l);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}
.appeal-check {
  width:18px; height:18px; border:1.5px solid var(--border); border-radius:4px;
  background:var(--bg); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:11px;
  transition:all .15s;
}
.appeal-item input:checked + .appeal-label .appeal-check {
  background:var(--accent); border-color:var(--accent); color:#fff;
}
.appeal-info { flex:1; }
.appeal-name { font-size:14px; font-weight:700; color:var(--text); }
.appeal-desc { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.4; }
.ai-rec-badge { display:inline-block; background:var(--purple); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
.appeal-reason { font-size:11px; color:var(--purple); background:var(--purple-l); border-radius:4px; padding:4px 8px; margin-top:6px; line-height:1.5; display:none; }
.appeal-item input:checked + .appeal-label .appeal-reason { display:block; }

.strategy-note { background:var(--green-l); border:1px solid #a7f3d0; border-radius:6px; padding:12px 16px; font-size:13px; color:#065f46; line-height:1.7; margin-top:16px; }
.strategy-note strong { font-weight:700; }

/* 笏笏 MAIL EDITOR (STEP 5) 笏笏 */
.mail-sections { display:flex; flex-direction:column; gap:10px; }
.ms { border:1.5px solid var(--border); border-radius:7px; overflow:hidden; transition:border-color .15s; }
.ms:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.1); }
.ms-head { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); }
.ms-label { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
.ms-badge { padding:1px 7px; border-radius:10px; font-size:10px; font-weight:800; }
.mb-req { background:#fee2e2; color:var(--red); }
.mb-ai  { background:#dbeafe; color:#1d4ed8; }
.mb-opt { background:var(--surface2); color:var(--muted); }
.ms-body { position:relative; }
.ms textarea { border:none; border-radius:0; min-height:68px; padding:12px 14px; font-size:14px; line-height:1.8; box-shadow:none; }
.ms textarea:focus { border-color:transparent; box-shadow:none; }
.ms textarea.subj { min-height:44px; font-size:15px; font-weight:700; }
.cc { position:absolute; bottom:6px; right:10px; font-size:10px; color:#b0b8c4; pointer-events:none; }
.regen-btn { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border:1px solid var(--border); border-radius:4px; background:var(--bg); font:600 11px inherit; color:var(--muted); cursor:pointer; transition:all .15s; }
.regen-btn:hover { background:var(--purple-l); color:var(--purple); border-color:var(--purple); }

/* action bar */
.act-bar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:7px; margin-top:12px; }
.copy-btn { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border:1.5px solid var(--border); border-radius:5px; background:var(--bg); font:600 12px inherit; color:var(--muted); cursor:pointer; transition:all .15s; }
.copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.copy-btn.ok { border-color:var(--green); color:var(--green); background:var(--green-l); }

/* reason box */
.reason-box { background:var(--amber-l); border:1px solid #fde68a; border-radius:7px; padding:16px 18px; margin-top:14px; }
.reason-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:#78350f; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.reason-body { font-size:13px; color:#92400e; line-height:1.75; white-space:pre-wrap; }

/* preview */
.preview-box { background:#fafbfc; border:1px solid var(--border); border-radius:7px; padding:20px 24px; font-size:14px; line-height:1.9; white-space:pre-wrap; display:none; }
.preview-box.on { display:block; }

/* process log */
.process-log { background:#0f172a; border-radius:7px; padding:16px 18px; font-family:monospace; font-size:12px; color:#94a3b8; line-height:1.8; overflow-x:auto; margin-top:14px; }
.log-key { color:#7dd3fc; }
.log-val { color:#a5f3fc; }
.log-str { color:#86efac; }

/* misc */
.divider { height:1px; background:var(--border); margin:18px 0; }
.section-desc { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:18px; }
.onboard-banner { background:linear-gradient(135deg,#1e3a8a,#4c1d95); color:#fff; border-radius:var(--r); padding:20px 24px; margin-bottom:20px; }
.ob-title { font-size:18px; font-weight:800; margin-bottom:6px; }
.ob-sub { font-size:13px; color:#bfdbfe; line-height:1.7; }
.ob-steps { display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
.ob-step { background:rgba(255,255,255,.1); border-radius:6px; padding:8px 14px; font-size:12px; color:#e0e7ff; display:flex; align-items:center; gap:7px; }
.ob-step-n { background:rgba(255,255,255,.2); width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11px; flex-shrink:0; }

@media(max-width:640px){
  .analysis-grid { grid-template-columns:1fr; }
  .ab.full { grid-column:span 1; }
  .grid2 { grid-template-columns:1fr; }
  .fg.s2 { grid-column:span 1; }
  .ob-steps { flex-direction:column; gap:8px; }
}

.footer { text-align:center; font-size:12px; color:#9ca3af; border-top:1px solid var(--border); padding-top:16px; margin-top:40px; }

/* 笏笏 PRIORITY RANKING 笏笏 */
.priority-list { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.priority-item { display:flex; align-items:flex-start; gap:12px; background:var(--bg); border:1.5px solid var(--border); border-radius:8px; padding:14px 16px; transition:border-color .15s; }
.priority-item.rank-1 { border-color:var(--accent); background:var(--accent-l); }
.priority-item.rank-2 { border-color:var(--purple); background:var(--purple-l); }
.priority-item.rank-3 { border-color:var(--green); background:var(--green-l); }
.priority-rank { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; flex-shrink:0; }
.rank-1 .priority-rank { background:var(--accent); color:#fff; }
.rank-2 .priority-rank { background:var(--purple); color:#fff; }
.rank-3 .priority-rank { background:var(--green); color:#fff; }
.priority-body { flex:1; }
.priority-name { font-size:14px; font-weight:800; color:var(--text); margin-bottom:4px; }
.priority-reason { font-size:12px; color:var(--muted); line-height:1.65; }
.priority-other { font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px 14px; margin-top:4px; }
.priority-other-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }

/* 笏笏 CANDIDATE TYPE BADGE 笏笏 */
.type-fixed-badge { display:inline-flex; align-items:center; gap:8px; background:var(--purple); color:#fff; border-radius:6px; padding:6px 14px; font-size:13px; font-weight:700; margin-bottom:4px; }
.type-fixed-tag { font-size:10px; background:rgba(255,255,255,.25); border-radius:4px; padding:2px 6px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; }

/* 笏笏 RECRUITER GUIDANCE 笏笏 */
.guidance-list { display:flex; flex-direction:column; gap:12px; }
.guidance-item { background:var(--bg); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.guidance-flow { display:flex; flex-direction:column; }
.guidance-row { display:flex; align-items:flex-start; gap:10px; padding:10px 16px; }
.guidance-row + .guidance-row { border-top:1px solid var(--border); }
.guidance-row-label { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; min-width:90px; padding-top:2px; }
.guidance-row-label.lbl-judge { color:var(--purple); }
.guidance-row-label.lbl-reason { color:var(--accent); }
.guidance-row-label.lbl-action { color:var(--green); }
.guidance-row-text { font-size:13px; color:var(--text); line-height:1.7; flex:1; }
.guidance-row.row-action { background:var(--green-l); }

/* 笏笏 LEARNING DATA NOTICE 笏笏 */
.learning-badge { display:inline-flex; align-items:center; gap:5px; background:#0f172a; color:#7dd3fc; border-radius:4px; padding:3px 9px; font-size:10px; font-weight:700; letter-spacing:.4px; margin-left:8px; vertical-align:middle; }

/* 笏笏 INFO QUALITY 笏笏 */
.iq-bar-wrap { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:7px; margin-bottom:14px; }
.iq-label { font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap; }
.iq-bar { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
.iq-fill { height:100%; border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); }
.iq-fill.high { background:var(--green); }
.iq-fill.mid  { background:var(--amber); }
.iq-fill.low  { background:var(--red); }
.iq-score { font-size:16px; font-weight:900; min-width:40px; text-align:right; }
.iq-score.high { color:var(--green); }
.iq-score.mid  { color:var(--amber); }
.iq-score.low  { color:var(--red); }

/* 笏笏 AI QUESTIONS (STEP 1.5) 笏笏 */
.aq-intro { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:16px; background:var(--amber-l); border:1px solid #fde68a; border-radius:6px; padding:12px 16px; }
.aq-list { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
.aq-item { background:var(--bg); border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
.aq-item-head { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); }
.aq-priority { font-size:10px; font-weight:800; padding:2px 8px; border-radius:4px; }
.aqp-high { background:#fee2e2; color:var(--red); }
.aqp-med  { background:#fef3c7; color:var(--amber); }

.batch-cand { background:var(--bg); border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
.batch-cand-head { display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--surface); border-bottom:1px solid var(--border); }

.bcs-err    { background:var(--red-l); color:var(--red); }
.batch-cand-body { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px; }

function loadProjects() {
  try { return JSON.parse(localStorage.getItem(PROJECT_KEY) || '[]'); }

}

/** 繝励Ο繧ｸ繧ｧ繧ｯ繝医ｒ菫晏ｭ假ｼ域眠隕・or 荳頑嶌縺搾ｼ・*/
function saveProject(proj) {
  const projects = loadProjects();
  const id = proj.id || Date.now().toString();
  proj.id = id;
  proj.updatedAt = new Date().toISOString();
  if (!proj.createdAt) proj.createdAt = proj.updatedAt;

  const idx = projects.findIndex(p => p.id === id);
  if (idx >= 0) projects[idx] = proj;
  else projects.unshift(proj);

  localStorage.setItem(PROJECT_KEY, JSON.stringify(projects.slice(0, 30)));
  return id;
}

  const projects = loadProjects().filter(p => p.id !== id);

}

function saveEditLog(historyId, section, aiVersion, edited, reason) {
  const logs = loadEditLogs();

    id:        Date.now().toString(),
    savedAt:   new Date().toISOString(),
    historyId,
    section,
    aiVersion,
    edited,
    reason:    reason || '',
    // 蟄ｦ鄙偵ョ繝ｼ繧ｿ逕ｨ繝｡繧ｿ諠・ｱ

  };
  logs.unshift(entry);
  // 譛螟ｧ200莉ｶ

  return entry.id;

function exportEditLogs() {
  const logs = loadEditLogs();
  const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `bscout_editlogs_${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);

function saveScoutHistory() {
  const history = loadScoutHistory();
  const id = S.currentHistoryId || Date.now().toString();
  S.currentHistoryId = id;

  const entry = {
    id,
    savedAt: new Date().toISOString(),
    projectId: S.currentProjectId || null,
    candidate: { ...S.candidate },
    job:       { position: S.job.position, company: S.job.company },
    analysis: {
      candidateTypeCategory: (S.analysis || {}).candidateTypeCategory || '',
      score: (S.analysis || {}).score || 0
    },
    mail:    { ...(S.mail || {}) },
    mailAi:  { ...(S.mail || {}) },   // Phase1.5: AI逕滓・蜴滓枚繧剃ｿ晄戟
    selectedAppeals: [...(S.selectedAppeals || [])],
    result: {
      replied:          null,
      meetingScheduled: null,
      hired:            null,
      feedbackNote:     ''
    }
  };

  const idx = history.findIndex(h => h.id === id);
  if (idx >= 0) history[idx] = entry;
  else history.unshift(entry);

  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 50)));
  return id;
}

function loadScoutHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

function updateHistoryResult(id, result) {
  const history = loadScoutHistory();
  const entry = history.find(h => h.id === id);
  if (!entry) return;
  entry.result = { ...entry.result, ...result };
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function deleteHistoryEntry(id) {
  const history = loadScoutHistory().filter(h => h.id !== id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function go(n) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  if      (n === '15')      { $('p15').classList.add('on'); }
  else if (n === 'Batch')   { $('pBatch').classList.add('on'); }

  else {
    document.getElementById('p' + n).classList.add('on');
    for (let i = 1; i <= 5; i++) {
      const el = $('si' + i); el.classList.remove('active', 'done');
      if      (i < n)   el.classList.add('done');
      else if (i === n) el.classList.add('active');
    }
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showLoad(steps) {
  steps = steps || 5; lstep = 0;

  }, 1100);

function updateBatchRunBtn() {
  let valid = false;
  for (let i = 1; i <= batchCandCount; i++) {
    const co = $(`bc_co_${i}`), role = $(`bc_role_${i}`), exp = $(`bc_exp_${i}`), sk = $(`bc_sk_${i}`);
    if (co && role && exp && sk && co.value.trim() && role.value.trim() && exp.value.trim() && sk.value.trim()) { valid = true; break; }
  }
  if (!S.job || !S.job.position) valid = false;
  $('batchRunBtn').disabled = !valid;
}

async function runBatch() {
  const j = S.job?.position
    ? S.job
    : { position: $('j_pos')?.value.trim() || '', company: $('j_co')?.value.trim() || '', description: $('j_desc')?.value.trim() || '', requirements: $('j_req')?.value.trim() || '', appeal: $('j_ap')?.value.trim() || '' };
  if (!j.position) { err('豎ゆｺｺ諠・ｱ縺ｮ繝昴ず繧ｷ繝ｧ繝ｳ蜷阪ｒ蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }

  const candidates = [];
  for (let i = 1; i <= batchCandCount; i++) {
    const co = $(`bc_co_${i}`), role = $(`bc_role_${i}`), exp = $(`bc_exp_${i}`), sk = $(`bc_sk_${i}`), why = $(`bc_why_${i}`);
    if (!co || !co.value.trim() || !role?.value.trim() || !exp?.value.trim() || !sk?.value.trim()) continue;
    candidates.push({ idx: i, company: co.value.trim(), role: role.value.trim(), experience: exp.value.trim(), skills: sk.value.trim(), projects: '', reason: why?.value.trim() || '' });
  }
  if (candidates.length === 0) { err('譛牙柑縺ｪ蛟呵｣懆・ュ蝣ｱ縺・莉ｶ繧ゅ≠繧翫∪縺帙ｓ縲・); return; }

  $('batchResult').classList.remove('on');
  $('batchResultGrid').innerHTML = '';
  BATCH_RESULTS.length = 0;
  const prog = $('batchProgress'), progTxt = $('batchProgressText');
  prog.classList.add('on'); $('batchRunBtn').disabled = true;

  for (let ci = 0; ci < candidates.length; ci++) {
    const cand = candidates[ci];
    const statusEl = $(`bcand_status_${cand.idx}`);
    if (statusEl) { statusEl.className = 'batch-cand-status bcs-run'; statusEl.textContent = '蛻・梵荳ｭ...'; }
    progTxt.textContent = `蛻・梵荳ｭ ${ci + 1}/${candidates.length}莉ｶ逶ｮ 窶・${cand.role}・・{cand.company}・荏;
    try {
      const result = await runBatchSingle(cand, j);
      BATCH_RESULTS.push(result);
      if (statusEl) { statusEl.className = 'batch-cand-status bcs-done'; statusEl.textContent = '螳御ｺ・; }
    } catch (e) {
      BATCH_RESULTS.push({ cand, error: e.message });
      if (statusEl) { statusEl.className = 'batch-cand-status bcs-err'; statusEl.textContent = '繧ｨ繝ｩ繝ｼ'; }
    }
    if (ci < candidates.length - 1) await new Promise(r => setTimeout(r, 600));
  }
  prog.classList.remove('on'); $('batchRunBtn').disabled = false;
  renderBatchResults(); $('batchResult').classList.add('on');
}

  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '笨・隱ｭ縺ｿ霎ｼ縺ｿ縺ｾ縺励◆';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('saved'); }, 1800);
  }
}

/** 迴ｾ蝨ｨ縺ｮ繝輔か繝ｼ繝蜀・ｮｹ繧偵・繝ｭ繧ｸ繧ｧ繧ｯ繝医→縺励※菫晏ｭ・*/
function saveCurrentProject() {
  const pos = $('j_pos')?.value.trim();
  if (!pos) { err('繝昴ず繧ｷ繝ｧ繝ｳ蜷阪ｒ蜈･蜉帙＠縺ｦ縺九ｉ豎ゆｺｺ諠・ｱ繧剃ｿ晏ｭ倥＠縺ｦ縺上□縺輔＞縲・); return; }
  const proj = buildProjectFromForm();
  const id = saveProject(proj);
  S.currentProjectId = id;
  renderProjectSelector();

  const btn = $('projSaveBtn');
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '笨・菫晏ｭ倥＠縺ｾ縺励◆';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('saved'); }, 1800);
  }
}

/** 繝励Ο繧ｸ繧ｧ繧ｯ繝育ｮ｡逅・Δ繝ｼ繝繝ｫ繧帝幕縺・*/
function openProjectModal() {
  renderProjectModalList();
  $('projModalOverlay').classList.add('on');
}

/** 繝励Ο繧ｸ繧ｧ繧ｯ繝育ｮ｡逅・Δ繝ｼ繝繝ｫ繧帝哩縺倥ｋ */
function closeProjectModal() {
  $('projModalOverlay').classList.remove('on');
}

/** 繝｢繝ｼ繝繝ｫ蜀・・繧ｪ繝ｼ繝舌・繝ｬ繧､繧ｯ繝ｪ繝・け縺ｧ髢峨§繧具ｼ医Δ繝ｼ繝繝ｫ蜀・け繝ｪ繝・け縺ｯ髢峨§縺ｪ縺・ｼ・*/
function closeProjModal(event) {
  if (event.target === $('projModalOverlay')) closeProjectModal();
}

/** 繝｢繝ｼ繝繝ｫ蜀・・繝励Ο繧ｸ繧ｧ繧ｯ繝医Μ繧ｹ繝医ｒ謠冗判 */
function renderProjectModalList() {
  const projects = loadProjects();
  const list  = $('projModalList');
  const empty = $('projModalEmpty');
  if (!list) return;

  if (projects.length === 0) {
    list.innerHTML = '';
    if (empty) empty.style.display = 'block';
    return;
  }
  if (empty) empty.style.display = 'none';

  list.innerHTML = projects.map(p => {
    const d = new Date(p.updatedAt);
    const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    return `
      <div class="proj-item">
        <div class="proj-item-info">
          <div class="proj-item-name">${esc(p.name || p.position)}</div>
          <div class="proj-item-pos">${esc(p.position)}${p.company ? ' 窶・' + esc(p.company) : ''}</div>
          <div class="proj-item-date">譛邨よ峩譁ｰ: ${dateStr}${p.successExamples ? ' 箝・謌仙粥萓九≠繧・ : ''}</div>
        </div>
        <div class="proj-item-actions">
          <button class="proj-load-btn" onclick="loadProject('${p.id}')">隱ｭ縺ｿ霎ｼ繧</button>
          <button class="proj-del-btn" onclick="deleteProjectConfirm('${p.id}')">蜑企勁</button>
        </div>
      </div>`;
  }).join('');
}

/** 繝励Ο繧ｸ繧ｧ繧ｯ繝亥炎髯､遒ｺ隱・*/
function deleteProjectConfirm(id) {
  if (!confirm('縺薙・豎ゆｺｺ繝励Ο繧ｸ繧ｧ繧ｯ繝医ｒ蜑企勁縺励∪縺吶°・・)) return;
  deleteProject(id);
  if (S.currentProjectId === id) S.currentProjectId = null;
  renderProjectModalList();
  renderProjectSelector();
}

// 繝壹・繧ｸ隱ｭ縺ｿ霎ｼ縺ｿ譎ゅ↓繝励Ο繧ｸ繧ｧ繧ｯ繝磯∈謚槭ヰ繝ｼ繧貞・譛滓緒逕ｻ
document.addEventListener('DOMContentLoaded', () => {
  renderProjectSelector();
});
// DOMContentLoaded縺梧里縺ｫ逋ｺ轣ｫ貂医∩縺ｮ蝣ｴ蜷医↓蛯吶∴縺ｦ縺吶＄縺ｫ繧ょｮ溯｡・if (document.readyState !== 'loading') renderProjectSelector();

</script>
</body>
</html>
